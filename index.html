<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Room</title>
<style>
  :root {
    --magenta: #ff00ff;
    --magenta-glow: rgba(255, 0, 255, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

html, body {
  height: 100%;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

  .playlist {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 64px;
  }

  .player {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .cover-3d {
    width: 260px;
    height: 260px;
    margin-bottom: 32px;
    position: relative;
  }

  .cover-face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px var(--magenta-glow);
    background: #111;
  }

  .cover-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    user-select: none;
  }

  .cover-front img {
    object-position: center top;
    transform: scale(1.1);
  }

  .artist {
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--magenta);
    opacity: 0.85;
    margin-bottom: 8px;
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    color: var(--magenta);
    margin-bottom: 32px;
    line-height: 1.2;
    text-shadow: 0 0 20px var(--magenta-glow);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 24px;
  }

  button {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--magenta);
    transition: transform 0.15s ease, filter 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button:hover { filter: drop-shadow(0 0 12px var(--magenta)); }
  button:active { transform: scale(0.92); }

  .play-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid var(--magenta);
    box-shadow: 0 0 24px var(--magenta-glow), inset 0 0 12px var(--magenta-glow);
  }

  .skip-btn { width: 44px; height: 44px; opacity: 0.8; }

  .progress-wrap { width: 100%; margin-bottom: 12px; }

  .progress {
    width: 100%;
    height: 4px;
    background: rgba(255, 0, 255, 0.2);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--magenta);
    box-shadow: 0 0 8px var(--magenta);
    transition: width 0.1s linear;
  }

  .time {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 12px;
    color: var(--magenta);
    opacity: 0.7;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    .cover-3d { width: 200px; height: 200px; }
    .title { font-size: 22px; }
  }

  /* ===== ЧАТ ===== */
  .chat-toggle {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: 32px;
    height: 80px;
    background: #000;
    border: 1px solid var(--magenta);
    border-right: none;
    border-radius: 12px 0 0 12px;
    color: var(--magenta);
    font-size: 18px;
    z-index: 1001;
    box-shadow: 0 0 20px var(--magenta-glow);
    cursor: pointer;
    transition: right 0.3s ease;
  }

  .chat-toggle.open { right: 320px; }

  .chat-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 320px;
    height: 100%;
    background: #000;
    border-left: 1px solid var(--magenta);
    box-shadow: -4px 0 40px var(--magenta-glow);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    z-index: 1000;
  }

  .chat-panel.open { transform: translateX(0); }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255, 0, 255, 0.3);
    color: var(--magenta);
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .chat-header-actions {
    display: flex;
    gap: 12px;
  }

  .chat-header button {
    color: var(--magenta);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .chat-header button:hover { opacity: 1; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 14px;
    line-height: 1.4;
  }

  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--magenta);
    border-radius: 3px;
  }

  .msg-nick {
    color: var(--magenta);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }

  .msg-text {
    color: #fff;
    word-wrap: break-word;
  }

  .msg-time {
    font-size: 10px;
    color: var(--magenta);
    opacity: 0.4;
    margin-left: 6px;
  }

  .chat-input-area {
    padding: 12px;
    border-top: 1px solid rgba(255, 0, 255, 0.3);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .chat-input-area input {
    width: 100%;
    background: #000;
    border: 1px solid var(--magenta);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--magenta);
    font-size: 13px;
    outline: none;
    font-family: inherit;
    transition: box-shadow 0.2s ease;
  }

  .chat-input-area input:focus {
    box-shadow: 0 0 12px var(--magenta-glow);
  }

  .chat-input-area input::placeholder {
    color: var(--magenta);
    opacity: 0.4;
  }

  .send-row {
    display: flex;
    gap: 8px;
  }

  .send-row input { flex: 1; }

  .send-btn {
    padding: 10px 16px;
    border: 1px solid var(--magenta);
    border-radius: 6px;
    color: var(--magenta);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .send-btn:hover {
    background: rgba(255, 0, 255, 0.15);
    box-shadow: 0 0 12px var(--magenta-glow);
  }

  @media (max-width: 480px) {
    .chat-panel { width: 100%; }
    .chat-toggle.open { right: 100%; }
  }
</style>
</head>
<body>

<div class="playlist">

  <div class="player" data-audio="audio4">
    <div class="cover-3d">
      <div class="cover-face cover-front">
        <img src="cover4.png" alt="">
      </div>
    </div>

    <div class="artist">Sashk</div>
    <div class="title">fire</div>

    <div class="controls">
      <button class="skip-btn" data-action="back" aria-label="Назад 10 секунд">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
        </svg>
      </button>
      <button class="play-btn" data-action="play" aria-label="Играть">
        <svg class="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <button class="skip-btn" data-action="forward" aria-label="Вперёд 10 секунд">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 6v12l8.5-6L13 6zM4 18l8.5-6L4 6v12z"/>
        </svg>
      </button>
    </div>

    <div class="progress-wrap">
      <div class="progress" data-role="progress">
        <div class="progress-fill" data-role="progress-fill"></div>
      </div>
    </div>

    <div class="time">
      <span data-role="current">0:00</span>
      <span data-role="duration">0:00</span>
    </div>
  </div>

</div>

<audio id="audio4" src="lastsong.mp3" preload="metadata"></audio>

<!-- ===== ЧАТ ===== -->
<button class="chat-toggle" id="chat-toggle" aria-label="Открыть чат">💬</button>

<div class="chat-panel" id="chat-panel">
  <div class="chat-header">
    <span>Чат</span>
    <div class="chat-header-actions">
      <button id="chat-clear" title="Очистить чат">Очистить</button>
      <button id="chat-close" title="Скрыть">✕</button>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages"></div>

  <div class="chat-input-area">
    <input type="text" id="chat-nick" placeholder="твой ник" maxlength="20" autocomplete="off">
    <div class="send-row">
      <input type="text" id="chat-text" placeholder="сообщение..." maxlength="300" autocomplete="off">
      <button class="send-btn" id="chat-send">→</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, remove, serverTimestamp, query, limitToLast
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7XJDjsL698FfD7QUMGOaxm77///",
    authDomain: "creator-75dac.firebaseapp.com",
    databaseURL: "https://creator-75dac-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "creator-75dac",
    storageBucket: "creator-75dac.firebasestorage.app",
    messagingSenderId: "86422721022",
    appId: "1:86422721022:web:ed2ae88a1bc1be46eff0af",
    measurementId: "G-FN7KWCZX7X"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ===== ЧАТ =====
  const chatRef = ref(db, "musicroom");
  const messagesEl = document.getElementById('chat-messages');
  const nickEl = document.getElementById('chat-nick');
  const textEl = document.getElementById('chat-text');
  const sendBtn = document.getElementById('chat-send');
  const clearBtn = document.getElementById('chat-clear');
  const panel = document.getElementById('chat-panel');
  const toggle = document.getElementById('chat-toggle');
  const closeBtn = document.getElementById('chat-close');

  // Восстанавливаем ник
  nickEl.value = localStorage.getItem('chatNick') || '';
  nickEl.addEventListener('input', () => localStorage.setItem('chatNick', nickEl.value.trim()));

  // Открыть / закрыть
  function openChat() {
    panel.classList.add('open');
    toggle.classList.add('open');
    toggle.textContent = '✕';
    setTimeout(() => textEl.focus(), 320);
  }
  function closeChat() {
    panel.classList.remove('open');
    toggle.classList.remove('open');
    toggle.textContent = '💬';
  }
  toggle.addEventListener('click', () => {
    panel.classList.contains('open') ? closeChat() : openChat();
  });
  closeBtn.addEventListener('click', closeChat);

  // Отправка
  function sendMessage() {
    const nick = nickEl.value.trim() || 'anon';
    const text = textEl.value.trim();
    if (!text) return;

    push(chatRef, {
      nick,
      text,
      ts: Date.now()
    }).catch(err => {
      console.error('Ошибка отправки:', err);
      alert('Не удалось отправить. Проверь правила Firebase.');
    });

    textEl.value = '';
    textEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  textEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Очистка
  clearBtn.addEventListener('click', () => {
    if (!confirm('Удалить все сообщения?')) return;
    remove(chatRef).catch(err => {
      console.error('Ошибка очистки:', err);
      alert('Не удалось очистить. Проверь правила Firebase.');
    });
  });

  // Рендер сообщений
  const chatQuery = query(chatRef, limitToLast(200));
  let firstLoad = true;

  onValue(chatQuery, (snapshot) => {
    messagesEl.innerHTML = '';
    const items = [];
    snapshot.forEach((child) => {
      items.push({ id: child.key, ...child.val() });
    });
    items.sort((a, b) => (a.ts || 0) - (b.ts || 0));

    items.forEach((m) => {
      const div = document.createElement('div');

      const nick = document.createElement('div');
      nick.className = 'msg-nick';
      nick.textContent = m.nick || 'anon';
      if (m.ts) {
        const t = document.createElement('span');
        t.className = 'msg-time';
        t.textContent = new Date(m.ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        nick.appendChild(t);
      }

      const text = document.createElement('div');
      text.className = 'msg-text';
      text.textContent = m.text || '';

      div.appendChild(nick);
      div.appendChild(text);
      messagesEl.appendChild(div);
    });

    if (firstLoad) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
      firstLoad = false;
    } else {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }, (err) => {
    console.error('Ошибка чтения чата:', err);
    messagesEl.innerHTML = '<div style="color:#ff00ff;opacity:0.6;font-size:12px;">Не удалось загрузить чат. Проверь правила Firebase.</div>';
  });

  // ===== ПЛЕЕР =====
  const PLAY = '<path d="M8 5v14l11-7z"/>';
  const PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

  const fmt = (sec) => {
    if (!isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  };

  document.querySelectorAll('.player').forEach((player) => {
    const audioId = player.dataset.audio;
    const audio = document.getElementById(audioId);
    if (!audio) return;

    const playBtn = player.querySelector('[data-action="play"]');
    const playIcon = player.querySelector('.play-icon');
    const back = player.querySelector('[data-action="back"]');
    const forward = player.querySelector('[data-action="forward"]');
    const progress = player.querySelector('[data-role="progress"]');
    const progressFill = player.querySelector('[data-role="progress-fill"]');
    const current = player.querySelector('[data-role="current"]');
    const duration = player.querySelector('[data-role="duration"]');

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        document.querySelectorAll('audio').forEach((a) => {
          if (a !== audio) a.pause();
        });
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play',  () => playIcon.innerHTML = PAUSE);
    audio.addEventListener('pause', () => playIcon.innerHTML = PLAY);

    audio.addEventListener('loadedmetadata', () => {
      duration.textContent = fmt(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      const pct = (audio.currentTime / audio.duration) * 100 || 0;
      progressFill.style.width = pct + '%';
      current.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      playIcon.innerHTML = PLAY;
      progressFill.style.width = '0%';
      audio.currentTime = 0;
    });

    progress.addEventListener('click', (e) => {
      const rect = progress.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    back.addEventListener('click',    () => audio.currentTime = Math.max(0, audio.currentTime - 10));
    forward.addEventListener('click', () => audio.currentTime = Math.min(audio.duration, audio.currentTime + 10));
  });
</script>

</body>
</html>
